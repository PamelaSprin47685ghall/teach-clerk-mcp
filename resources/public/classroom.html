<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Clerk 课堂</title>
  <link rel="stylesheet" href="/classroom.css">
</head>
<body>
  <main class="layout">
    <header class="topbar">
      <div class="brand"><span class="logo">◈</span><strong>Clerk 课堂</strong><span class="subtitle">生成式白板</span></div>
      <div id="indicator" class="status">等待老师开始</div>
    </header>
    <div class="canvas" id="canvas">
      <iframe id="board" title="Clerk 实时教学白板" src="/_clerk"></iframe>
      <button id="to-bottom" class="to-bottom" type="button" hidden>回到最新内容 ↓</button>
    </div>
    <section class="composer" aria-label="学生回答">
      <div class="compose-inner">
        <textarea id="answer" aria-label="输入回答" rows="2" placeholder="老师正在准备..." disabled></textarea>
        <div class="controls">
          <span class="hint">Enter 发送 · Shift+Enter 换行</span>
          <div class="buttons">
            <button id="skip" class="secondary" disabled>暂不回答</button>
            <button id="send" class="primary" disabled>发送 ↗</button>
          </div>
        </div>
        <p id="message" class="message" role="status" aria-live="polite"></p>
      </div>
    </section>
  </main>
  <script src="/classroom.js" defer></script>
</body>
</html>
